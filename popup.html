<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restore X Dim Mode</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>Restore X Dim Mode</h1>
      <p>Toggle the dark-blue Dim theme for X/Twitter tabs.</p>
      <label class="toggle">
        <input id="dim-toggle" type="checkbox" />
        <span>Enable Dim</span>
      </label>
      <small>Refresh open X/Twitter tabs if the change does not appear immediately.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
